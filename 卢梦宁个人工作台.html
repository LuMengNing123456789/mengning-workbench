<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>卢梦宁 · 个人专属AI工作台</title>

<!-- PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="梦宁工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#FAF8F3;--card:#ffffff;--ink:#2F3E2F;--soft:#7a8a7a;--line:#E8EFE6;
  --g1:#C5D5CB;--g2:#A8C3A4;--g3:#8FB58A;--g4:#6FA86A;
  --accent:#D4A574;--pink:#D4A5A5;--blue:#A5B8D4;--yellow:#D4C9A5;--purple:#B5A5D4;
  --radius:18px;--shadow:0 2px 12px rgba(47,62,47,.06);--shadow-hover:0 6px 20px rgba(47,62,47,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);height:36px;flex-shrink:0}
.app{display:flex;height:calc(100vh - 36px);position:relative}
.sidebar{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;z-index:20}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
.content{flex:1;overflow-y:auto;padding:20px}
.ai-panel{width:320px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.profile-card{padding:20px 18px;border-bottom:1px solid var(--line)}
.profile-card .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g4));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;margin-bottom:10px}
.profile-card h1{font-size:19px;font-weight:700}
.profile-card p{font-size:12px;color:var(--soft);margin-top:2px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat-box{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat-box .num{font-size:20px;font-weight:700;color:var(--g4)}
.stat-box .lbl{font-size:11px;color:var(--soft);margin-top:2px}
.nav{padding:8px 0;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;transition:.15s;font-size:14px;position:relative;border-radius:0}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--g1);color:var(--ink);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g4);border-radius:0 3px 3px 0}
.nav-item .emoji{font-size:17px;flex-shrink:0}
.nav-item .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{margin-left:auto;background:#E07A5F;color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;min-width:18px;text-align:center;flex-shrink:0}
.nav-item .badge.zero{display:none}
.nav-item .nav-del{display:none;font-size:14px;color:#E07A5F;cursor:pointer;flex-shrink:0;padding:0 4px;opacity:.6}
.nav-item:hover .nav-del{display:inline}
.nav-add{padding:10px 18px;cursor:pointer;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px;transition:.15s;border-top:1px dashed var(--line)}
.nav-add:hover{color:var(--g4);background:var(--bg)}
.sidebar-bottom{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);display:flex;justify-content:space-between}
.sidebar-bottom span{cursor:pointer;padding:4px 0}
.module{display:none}
.module.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.mh h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.mh .sub{font-size:12px;color:var(--soft);margin-top:2px}
.btn{background:var(--g2);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--g4);box-shadow:var(--shadow-hover)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-outline{background:transparent;border:1px solid var(--g2);color:var(--g4)}
.btn-outline:hover{background:var(--g1)}
.btn-danger{background:#E07A5F;color:#fff}
.btn-danger:hover{background:#c75e45}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;transition:.2s}
.card:hover{box-shadow:var(--shadow-hover)}
.card h3{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .emoji{font-size:18px}
.progress{margin:8px 0}
.progress .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.progress .lab b{color:var(--g4)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g4));border-radius:5px;transition:.5s}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid #f2f6f0}
.row:last-child{border:none}.row .val{color:var(--soft);font-size:13px}
.badge{font-size:11px;padding:2px 9px;border-radius:7px;font-weight:500}
.b-green{background:#e3f1ea;color:#3d8769}.b-yellow{background:#fbf1da;color:#a8821f}
.b-pink{background:#fbe7ec;color:#b8556e}.b-blue{background:#e3eef6;color:#3d6f93}.b-gray{background:#eeeae2;color:#888}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:5px 12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover,.chip.active{background:var(--g2);color:#fff;border-color:var(--g2)}
.tag{font-size:10px;padding:1px 7px;border-radius:5px;color:#fff}
.t-exe{background:var(--g3)}.t-cook{background:var(--accent)}.t-read{background:var(--blue)}
.t-blog{background:var(--purple)}.t-income{background:var(--pink)}.t-learn{background:#E07A5F}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f2f6f0;cursor:pointer}
.todo-item:last-child{border:none}.todo-item .box{width:20px;height:20px;border:2px solid var(--g2);border-radius:6px;flex-shrink:0;transition:.2s;position:relative}
.todo-item.done .box{background:var(--g4);border-color:var(--g4)}
.todo-item.done .box::after{content:"✓";position:absolute;color:#fff;font-size:13px;top:-2px;left:2px;font-weight:700}
.todo-item.done .text{text-decoration:line-through;color:var(--soft)}
.todo-item .text{flex:1;font-size:14px}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{border-color:var(--g4);color:var(--g4);font-weight:600}
.workout-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);transition:.2s;cursor:pointer}
.workout-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.workout-card .wc-title{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.workout-card .wc-sub{font-size:13px;color:var(--soft);margin-bottom:8px;line-height:1.5}
.workout-card .wc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.wc-tag{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--bg)}
.wc-tag.play{background:var(--g4);color:#fff}
.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.money-box{background:var(--bg);border-radius:12px;padding:14px}
.money-box .t{font-size:12px;color:var(--soft)}.money-box .n{font-size:22px;font-weight:700;margin-top:3px}
.money-box.in .n{color:var(--g4)}.money-box.out .n{color:#E07A5F}
.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool-card{background:var(--card);border-radius:14px;padding:16px 10px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.tool-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.tool-card .emoji{font-size:26px;display:block;margin-bottom:6px}
.tool-card .name{font-size:13px;font-weight:600}
.countdown-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.countdown-item{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.countdown-item .cd-name{font-size:11px;color:var(--soft);margin-bottom:4px}
.countdown-item .cd-time{font-size:18px;font-weight:700;color:var(--g4)}
.countdown-item .cd-unit{font-size:10px;color:var(--soft)}
.punch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ring{width:60px;height:60px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}.ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.heat-cell{aspect-ratio:1;border-radius:4px;background:var(--line);font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.heat-cell.l1{background:#d4e8d0}.heat-cell.l2{background:#a8c3a4}
.heat-cell.l3{background:#8fb58a}.heat-cell.l4{background:#6fa86a;color:#fff;font-weight:600}
.achievement{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f6f0}
.achievement:last-child{border:none}.achievement .ach-icon{font-size:22px;flex-shrink:0}
.achievement .ach-info b{font-size:14px}.achievement .ach-info p{font-size:12px;color:var(--soft)}
.achievement.locked{opacity:.4}.achievement.locked .ach-icon{filter:grayscale(1)}
/* 心情选择 */
.mood-selector{display:flex;gap:6px;flex-wrap:wrap}
.mood-btn{font-size:28px;cursor:pointer;padding:6px 10px;border-radius:12px;transition:.2s;border:2px solid transparent;background:transparent}
.mood-btn:hover,.mood-btn.selected{border-color:var(--g3);background:var(--g1);transform:scale(1.1)}
/* 喝水 */
.water-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.water-cup{aspect-ratio:1;border-radius:14px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:.2s;border:2px solid transparent}
.water-cup:hover{transform:scale(1.08)}
.water-cup.filled{background:var(--g1);border-color:var(--g3)}
.water-cup.filled::after{content:attr(data-emoji)}
/* 图片上传预览 */
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.upload-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);position:relative;cursor:pointer}
.upload-item img,.upload-item video{width:100%;height:100%;object-fit:cover}
.upload-item .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.upload-item:hover .del{display:flex}
.upload-placeholder{border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:var(--soft);transition:.2s}
.upload-placeholder:hover{border-color:var(--g3);color:var(--g4);background:var(--g1)}
/* 输入框 */
.input-text{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none;background:var(--bg);font-family:inherit;resize:vertical;min-height:80px}
.input-text:focus{border-color:var(--g3)}
.input-row{display:flex;gap:8px;align-items:center}
.input-row input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none;background:var(--bg);font-family:inherit}
.input-row input:focus{border-color:var(--g3)}
/* 模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(47,62,47,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:12px}
.modal .close{float:right;cursor:pointer;font-size:20px;color:var(--soft)}
/* AI面板 */
.ai-header{padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-header .ai-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.ai-header .ai-status{font-size:12px;color:var(--soft);margin-top:2px;display:flex;align-items:center;gap:4px}
.ai-header .dot{width:7px;height:7px;border-radius:50%;background:var(--g4);display:inline-block}
.ai-body{flex:1;overflow-y:auto;padding:14px 16px}
.ai-intro{background:var(--bg);border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
.ai-msg{background:var(--g1);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
.ai-chips{display:flex;flex-direction:column;gap:6px}
.ai-chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px}
.ai-chip:hover{background:var(--g1);border-color:var(--g2)}
.ai-input{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.ai-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;background:var(--bg);outline:none}
.ai-input input:focus{border-color:var(--g2)}
.ai-input button{background:var(--g4);color:#fff;border:none;border-radius:10px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.mobile-nav-toggle{display:none;position:fixed;bottom:20px;right:20px;z-index:50;width:50px;height:50px;border-radius:50%;background:var(--g4);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(47,62,47,.3)}
.submit-row{display:flex;gap:8px;margin-top:8px}
.submit-row .btn{flex:1}
/* 时间线 */
.timeline-item{padding:10px 0 10px 20px;border-left:2px solid var(--g2);margin-left:8px;position:relative}
.timeline-item::before{content:'';position:absolute;left:-6px;top:14px;width:10px;height:10px;background:var(--g4);border-radius:50%}
.timeline-item .tl-date{font-size:11px;color:var(--soft);margin-bottom:2px}
.timeline-item .tl-title{font-size:14px;font-weight:600}
.timeline-item .tl-desc{font-size:12px;color:var(--soft);margin-top:2px;line-height:1.5}
/* 打卡按钮 */
.checkin-btn{padding:12px 20px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;width:100%}
.checkin-btn.undone{background:var(--bg);color:var(--soft);border:2px dashed var(--line)}
.checkin-btn.undone:hover{background:var(--g1);border-color:var(--g2);color:var(--g4)}
.checkin-btn.done{background:var(--g4);color:#fff}
/* 响应式 */
@media(max-width:1024px){.ai-panel{display:none}}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:36px;bottom:0;z-index:60;transform:translateX(-100%);transition:.3s;width:280px}
  .sidebar.open{transform:translateX(0)}
  .sidebar.open+.sidebar-overlay{display:block}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:59}
  .mobile-nav-toggle{display:flex;align-items:center;justify-content:center}
  .content{padding:14px;padding-bottom:80px}
  .tool-grid{grid-template-columns:repeat(2,1fr)}
  .mh h2{font-size:17px}
  .countdown-box{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="statusbar">
  <span id="sb-time">14:07</span>
  <span id="sb-date" style="font-size:12px;font-weight:400;color:var(--soft)"></span>
  <span>📶 5G 🔋 85%</span>
</div>

<div class="app">
  <!-- 侧边栏遮罩 -->
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- 左侧栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="profile-card">
      <div class="avatar">卢</div>
      <h1>卢梦宁</h1>
      <p>个人专属AI工作台</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="stat-todo">8</div><div class="lbl">今日待办</div></div>
        <div class="stat-box"><div class="num" id="stat-rate">62%</div><div class="lbl">完成率</div></div>
        <div class="stat-box"><div class="num" id="stat-streak">15</div><div class="lbl">连续打卡</div></div>
        <div class="stat-box"><div class="num" id="stat-output">5</div><div class="lbl">本周产出</div></div>
      </div>
    </div>
    <nav class="nav" id="nav-list">
    </nav>
    <div class="nav-add" onclick="addCustomModule()">➕ 自定义模块</div>

      <span onclick="resetModules()">🔄 恢复默认</span>
      <span onclick="toggleSidebar()">☰ 收起菜单</span>
    </div>
  </aside>

  <!-- 中央内容 -->
  <main class="content" id="content">
    <div id="module-container"></div>
  </main>

  <!-- 右侧AI助手 -->
  <aside class="ai-panel">
    <div class="ai-header">
      <div class="ai-title">✨ 梦宁 AI助手</div>
      <div class="ai-status"><span class="dot"></span> 在线 · 跨板块联动</div>
    </div>
    <div class="ai-body">
      <div class="ai-intro">你好！我是梦宁 AI 助手，可以帮你跨板块调用指令、生成内容。试试以下快捷指令 👇</div>
      <div id="ai-messages"></div>

        <div class="ai-chip" onclick="aiCmd('今日运动推荐')"><span>💪</span> 今日运动推荐</div>
        <div class="ai-chip" onclick="aiCmd('今日晚餐推荐')"><span>🍳</span> 今日晚餐推荐</div>
        <div class="ai-chip" onclick="aiCmd('复盘提示')"><span>📝</span> 复盘提示</div>
        <div class="ai-chip" onclick="aiCmd('每日一句商务英语')"><span>🇬🇧</span> 每日一句商务英语</div>
      </div>
    </div>
    <div class="ai-input">
      <input type="text" id="ai-input" placeholder="输入指令……" onkeypress="if(event.key==='Enter')aiSend()">
      <button onclick="aiSend()">发送</button>
    </div>
  </aside>
</div>

<button class="mobile-nav-toggle" onclick="toggleSidebar()">☰</button>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ============ 数据存储 ============
const STORAGE_KEY = 'mengning_workbench_v2';
function loadData(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||getDefaultData()}catch(e){return getDefaultData()}
}
function getDefaultData(){
  return {
    customModules:[],  // [{id,name,emoji}]
    hiddenModules:[],  // 被隐藏的默认模块id
    activeModule:'home',
    todos:[
      {text:'晨间伸展 15分钟',done:true,tag:'运动'},
      {text:'欧阳春晓直角肩跟练',done:true,tag:'运动'},
      {text:'阅读《无条件养育》第5章',done:true,tag:'阅读'},
      {text:'英语单词打卡20个',done:false,tag:'学习'},

      {text:'做晚饭：番茄炒蛋+汤',done:false,tag:'厨房'},

// ============ 导航渲染 ============
function getVisibleModules(){
  const all=[...DEFAULT_MODULES,...D.customModules.map(m=>({...m,badgeFn:undefined,badge:0}))];
  return all.filter(m=>!D.hiddenModules.includes(m.id));
}
function renderNav(){
  const nav=document.getElementById('nav-list');
  const modules=getVisibleModules();
  let html='';
  modules.forEach((m,i)=>{
    const isCustom=D.customModules.some(cm=>cm.id===m.id);
    let badgeVal=m.badgeFn?m.badgeFn():m.badge||0;
    html+=`<div class="nav-item${D.activeModule===m.id?' active':''}" data-module="${m.id}" onclick="switchModule('${m.id}')">
      <span class="emoji">${m.emoji}</span><span class="nav-label">${m.name}</span>
      <span class="badge${badgeVal<=0?' zero':''}">${badgeVal}</span>
      ${isCustom?`<span class="nav-del" onclick="event.stopPropagation();delCustomModule('${m.id}')">×</span>`:`<span class="nav-del" onclick="event.stopPropagation();hideModule('${m.id}')">−</span>`}
    </div>`;
  });
  nav.innerHTML=html;
  updateStats();
}
function updateStats(){
  const todoCount=D.todos.filter(t=>!t.done).length;
  const doneCount=D.todos.filter(t=>t.done).length;
  const total=todoCount+doneCount;
  document.getElementById('stat-todo').textContent=todoCount;
  document.getElementById('stat-rate').textContent=total>0?Math.round(doneCount/total*100)+'%':'0%';
}

// ============ 模块切换 ============
function switchModule(id){
  D.activeModule=id;saveData();
  renderNav();
  renderContent(id);
  if(window.innerWidth<=768)toggleSidebar();
}
function renderContent(id){
  const container=document.getElementById('module-container');
  const renderers={
    home:renderHome,todo:renderTodo,fitness:renderFitness,kitchen:renderKitchen,
    reading:renderReading,english:renderEnglish,baby:renderBaby,reflection:renderReflection,
    travel:renderTravel,growth:renderGrowth,water:renderWater,income:renderIncome,tools:renderTools
  };
  const r=renderers[id];
  if(r){container.innerHTML=r();}else{container.innerHTML=`<div class="card"><p>模块加载中...</p></div>`}
  container.className='module active';
  setTimeout(()=>afterRender(id),100);
}

}

  const r=D.reflections.find(r=>r.date===todayStr());

function addCustomModule(){
  document.getElementById('modal-content').innerHTML=`<h3>➕ 自定义模块</h3>
    <input class="input-text" id="cm-name" placeholder="模块名称，如：冥想" style="min-height:auto;margin-bottom:8px">
    <input class="input-text" id="cm-emoji" placeholder="emoji，如：🧘" style="min-height:auto;margin-bottom:8px" maxlength="2">
    <div class="submit-row"><button class="btn" onclick="saveCustomModule()">添加</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>`;
  document.getElementById('modal-overlay').classList.add('show')
}
function saveCustomModule(){
  const name=document.getElementById('cm-name').value.trim();
  const emoji=document.getElementById('cm-emoji').value.trim()||'📌';
  if(!name)return;
  const id='custom_'+Date.now();
  D.customModules.push({id,name,emoji});
  D.activeModule=id;saveData();closeModal();renderNav();renderContent(id)
}
function delCustomModule(id){
  D.customModules=D.customModules.filter(m=>m.id!==id);
  if(D.activeModule===id)D.activeModule='home';
  saveData();renderNav();renderContent(D.activeModule)
}
function hideModule(id){
  if(!D.hiddenModules.includes(id))D.hiddenModules.push(id);
  if(D.activeModule===id)D.activeModule='home';
  saveData();renderNav();renderContent(D.activeModule)
}
function resetModules(){
  D.hiddenModules=[];D.customModules=[];D.activeModule='home';
  saveData();renderNav();renderContent('home')
}

// ============ 待办操作 ============
function toggleTodo(i){D.todos[i].done=!D.todos[i].done;saveData();switchModule('todo')}
function showTodoInput(){
  showModal(`<h3>➕ 添加待办</h3>
    <input class="input-text" id="new-todo-text" placeholder="待办内容..." style="min-height:auto;margin-bottom:8px">
    <select id="new-todo-tag" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px">
      <option value="运动">运动</option><option value="厨房">厨房</option>
      <option value="阅读">阅读</option><option value="学习">学习</option>
      <option value="副业">副业</option><option value="复盘">复盘</option>
    </select>
    <div class="submit-row"><button class="btn" onclick="saveTodo()">添加</button></div>`);
}
function saveTodo(){
  const text=document.getElementById('new-todo-text').value.trim();
  if(!text)return;
  D.todos.push({text,done:false,tag:document.getElementById('new-todo-tag').value});
  saveData();closeModal();switchModule('todo')
}

// ============ 英语打卡 ============
function toggleEnglishCheckin(type){
  D.englishCheckin.date=todayStr();
  D.englishCheckin[type]=!D.englishCheckin[type];
  saveData();switchModule('english')
}

// ============ 运动打卡 ============
function toggleFitnessCheckin(){
  const ts=todayStr();
  if(D.fitnessCheckins.includes(ts))D.fitnessCheckins=D.fitnessCheckins.filter(d=>d!==ts);
  else D.fitnessCheckins.push(ts);
  saveData();switchModule('fitness')
}

function aiAddMsg(text,isUser){
  const container=document.getElementById('ai-messages');
  const div=document.createElement('div');
  div.className='ai-msg';
  div.innerHTML=(isUser?'<b>我：</b>':'<b>✨ AI：</b>')+text;
  container.appendChild(div);
  container.parentElement.scrollTop=container.parentElement.scrollHeight;
}

// ============ 状态栏 ============
function updateStatusbar(){
  const d=new Date();
  document.getElementById('sb-time').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const w=['日','一','二','三','四','五','六'];
  document.getElementById('sb-date').textContent=`${d.getMonth()+1}月${d.getDate()}日 星期${w[d.getDay()]}`;
}
updateStatusbar();setInterval(updateStatusbar,30000);

// ============ 侧边栏 ============
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

// ============ 热力图 ============
function genHeatmap(elId,days,done){
  const el=document.getElementById(elId);if(!el)return;
  let html='';
  for(let i=0;i<days;i++){let l=0;if(i<done){l=Math.floor(Math.random()*3)+1;if(i>=done-7)l=4}
    html+=`<div class="heat-cell ${l>0?'l'+l:''}">${i+1<=31?i+1:''}</div>`}
  el.innerHTML=html;
}

// ============ Tab事件委托 ============
document.addEventListener('click',function(e){
  if(e.target.classList.contains('tab')){
    const tabs=e.target.parentElement;
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    const tabId=tabs.id;
    if(tabId==='fitness-tabs'){
      ['ouyang','body','outdoor'].forEach(t=>{
        const el=document.getElementById('ft-'+t);if(el)el.style.display=t===e.target.dataset.ftab?'block':'none'
      });
    }else if(tabId==='kitchen-tabs'){
      ['dinner','weekend'].forEach(t=>{
        const el=document.getElementById('kt-'+t);if(el)el.style.display=t===e.target.dataset.ktab?'block':'none'
      });
    }else if(tabId==='income-tabs'){
      ['i-income','i-expense'].forEach(t=>{
        const el=document.getElementById('it-'+t);if(el)el.style.display=t===e.target.dataset.itab?'block':'none'
      });
    }
  }
});

// ============ 初始渲染 ============
function init(){
  renderNav();
  // 首次加载确保homenpage存在
  if(!D.activeModule||!getVisibleModules().find(m=>m.id===D.activeModule)){
    D.activeModule='home';
  }
  renderContent(D.activeModule);
  // 确保home content中的welcome已更新为中文
}
init();

// ============ 计算器 ============
let calcVal='';
function calcClick(k){
  if(k==='='){try{calcVal=String(Function('return '+calcVal)());}catch(e){calcVal='Error'}}
  else if(k==='C')calcVal='0';
  else{if(calcVal==='0'||calcVal==='Error')calcVal='';calcVal+=k}
  const disp=document.getElementById('calc-display');if(disp)disp.textContent=calcVal||'0';
}
